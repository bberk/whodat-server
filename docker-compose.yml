# Local development stack. Frontend dev server runs on the host via `pnpm dev`.
#
#   docker compose up -d postgres   # just the database
#   docker compose up               # database + backend API on http://localhost:8000
#
# See README.md for running the backend/frontend directly on the host.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      # Host port is overridable so each worktree can run its own instance; see
      # scripts/dev-postgres.sh.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 images expect a single mount at /var/lib/postgresql; mounting the old
      # /var/lib/postgresql/data path makes the entrypoint refuse to start.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@postgres:5432/app
      ENV: local
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run uvicorn app.api.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
