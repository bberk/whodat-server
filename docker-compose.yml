# Docker Compose stack for local development and single-host deployment.
#
#   docker compose up -d postgres   # just the database for a host-run backend
#   docker compose up -d            # database + backend API + built frontend
#
# Production values come from the environment (see README, "Deploy to production"); the
# defaults below keep local development working.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      # Host port is overridable so each worktree can run its own instance; see
      # scripts/dev-postgres.sh.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 images expect a single mount at /var/lib/postgresql; mounting the old
      # /var/lib/postgresql/data path makes the entrypoint refuse to start.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql+psycopg://app:app@postgres:5432/app}"
      ENV: "${ENV:-local}"
      SECRET_KEY: "${SECRET_KEY:-dev-insecure-change-me}"
      LEAGUE_CREDENTIALS_KEY: "${LEAGUE_CREDENTIALS_KEY:-}"
      # The browser origin(s) allowed to send the session cookie. Includes both the Vite dev
      # server and the composed frontend.
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run uvicorn app.api.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the bundle at build time; must be an origin the browser can reach.
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:8000}"
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
