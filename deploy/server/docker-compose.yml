# Production stack for one Linux server managed through an SSH Docker context.
# Compose reads these files on the laptop and sends build contexts to the remote daemon.
# Containers, named volumes, and all container paths live on that remote daemon.
name: whodat-server

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in deploy/server/.env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/server/.env}"
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB in deploy/server/.env}"
    volumes:
      # Postgres 18 expects the volume at /var/lib/postgresql, not its old data subdirectory.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 60s
    logging: *default-logging

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in deploy/server/.env}"
      ENV: production
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY in deploy/server/.env}"
      LEAGUE_CREDENTIALS_KEY: >-
        ${LEAGUE_CREDENTIALS_KEY:?Set LEAGUE_CREDENTIALS_KEY in deploy/server/.env}
      CORS_ORIGINS: "${CORS_ORIGINS:?Set CORS_ORIGINS in deploy/server/.env}"
      REFRESH_LEAGUE_INTERVAL_SECONDS: "${REFRESH_LEAGUE_INTERVAL_SECONDS:-5}"
      REFRESH_USER_LIMIT: "${REFRESH_USER_LIMIT:-3}"
      REFRESH_USER_WINDOW_SECONDS: "${REFRESH_USER_WINDOW_SECONDS:-3600}"
      SEASON_REFRESH_LEAGUE_INTERVAL_SECONDS: "${SEASON_REFRESH_LEAGUE_INTERVAL_SECONDS:-5}"
      SEASON_REFRESH_USER_LIMIT: "${SEASON_REFRESH_USER_LIMIT:-60}"
      SEASON_REFRESH_USER_WINDOW_SECONDS: "${SEASON_REFRESH_USER_WINDOW_SECONDS:-3600}"
      PROJECTION_REFRESH_ENABLED: "${PROJECTION_REFRESH_ENABLED:-true}"
      PROJECTION_REFRESH_TIMEZONE: "${PROJECTION_REFRESH_TIMEZONE:-America/New_York}"
      PROJECTION_REFRESH_LEAGUES: "${PROJECTION_REFRESH_LEAGUES:-}"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "uv run alembic upgrade head &&
             exec uv run uvicorn app.api.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    logging: *default-logging

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "https://${DOMAIN:?Set DOMAIN in deploy/server/.env}"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: *default-logging

  # --- Monitoring (LAN-only) -------------------------------------------------
  # Prometheus scrapes the backend's /metrics and node_exporter. Grafana is the only service
  # published on a LAN interface; Prometheus binds to loopback for SSH-tunnel access.
  # Prometheus and Grafana config is baked into their images: the daemon is remote and cannot see
  # a path on the laptop that runs manage.sh. Only named volumes and the server's own /proc,
  # /sys, and / are mounted.
  prometheus:
    build:
      context: ./monitoring/prometheus
      dockerfile: Dockerfile
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Size-based retention, overridable per deployment. The default is the requested 64 GB;
      # lower PROMETHEUS_RETENTION_SIZE when the host disk is smaller than the runbook guidance.
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-64GB}
      # WAL compression has been the default since Prometheus 2.20. It is passed explicitly so
      # the setting is visible and survives an image default change.
      - --storage.tsdb.wal-compression
      - --web.enable-lifecycle
    volumes:
      - prometheus_data:/prometheus
    ports:
      # Loopback only. Reach the Prometheus UI with
      # `ssh -L 9090:127.0.0.1:9090 deploy@<server-lan-ip>`.
      - "127.0.0.1:9090:9090"
    logging: *default-logging

  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^(/host/root)?/(sys|proc|dev|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    logging: *default-logging

  grafana:
    build:
      context: ./monitoring/grafana
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in deploy/server/.env}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/api.json
    ports:
      # Bind to the server's reserved LAN address only. With no address, Docker listens on every
      # interface, which can expose Grafana publicly and bypass UFW's INPUT rules. The value is
      # required so a missing setting fails the deploy instead of silently widening the bind.
      - "${GRAFANA_BIND_ADDRESS:?Set GRAFANA_BIND_ADDRESS to the server LAN address in deploy/server/.env}:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    logging: *default-logging

  caddy:
    build:
      context: ./caddy
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DOMAIN: "${DOMAIN:?Set DOMAIN in deploy/server/.env}"
      DUCKDNS_TOKEN: "${DUCKDNS_TOKEN:?Set DUCKDNS_TOKEN in deploy/server/.env}"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      # DNS-01 does not need inbound port 80. It is published only for HTTP-to-HTTPS redirects.
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: *default-logging

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  caddy_data:
  caddy_config:
