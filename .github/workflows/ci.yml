# CI for every pull request and for pushes to main.
#
# Job names are referenced by the branch ruleset (scripts/setup-github.sh) as required checks:
#   pre-commit | backend | frontend
# If you rename a job, update the ruleset too.
#
# Assumes backend/ and frontend/ exist (created in milestone M0):
#   backend/  : uv project (pyproject.toml + uv.lock), pytest, pytest-cov, mypy, ruff
#   frontend/ : pnpm project with a `packageManager` field in package.json, and scripts:
#               lint, typecheck, build, test:coverage (vitest run --coverage with the
#               `text` and `json-summary` reporters and coverage thresholds in the vitest config)
#
# Third-party actions are pinned to their latest major version tag. setup-uv publishes no moving
# major tag, so it is pinned to a full version (v10.3.0).

name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    env:
      SKIP: no-commit-to-branch # meaningless in CI (runs on main after merge)
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: uv sync --frozen
        working-directory: backend
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: uv tool install pre-commit
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
      - run: pre-commit run --all-files --show-diff-on-failure

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --frozen
      - name: Tests with coverage (backend total must be >= 85%)
        run: >-
          uv run pytest
          --cov=app --cov-branch
          --cov-report=term-missing --cov-report=xml
          --cov-fail-under=85
      - name: VP engine must be 100% covered (lines and branches)
        run: uv run coverage report --include="*/app/domain/*" --fail-under=100
      - name: Upload backend coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-backend
          path: backend/coverage.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Tests with coverage (thresholds are enforced in the vitest config)
        run: pnpm test:coverage
      - run: pnpm build
      - name: Upload frontend coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-frontend
          path: frontend/coverage/coverage-summary.json

  # Posts (and keeps updating) a single combined coverage comment on the PR.
  coverage-report:
    needs: [backend, frontend]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage
      - name: Build report
        run: |
          python3 scripts/coverage_report.py \
            --backend coverage/coverage-backend/coverage.xml \
            --frontend coverage/coverage-frontend/coverage-summary.json > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Post or update PR comment
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('report.md', 'utf8');
            const marker = '<!-- coverage-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  # An end-to-end (Playwright) job is added in milestone M6.
