# Pre-commit hooks for the whole repo. See ARCHITECTURE.md section 13.2.
#
# Install the commit and push hooks once per clone/worktree:
#   pre-commit install --hook-type pre-commit --hook-type pre-push
#
# Backend and frontend hooks only run when files under backend/ or frontend/ change, so the
# config is usable even before those trees exist (pre-M0). Hooks that auto-fix (ruff, prettier,
# eslint) leave the fixes unstaged and fail the commit; stage them and commit again.
fail_fast: false
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # pnpm 12 lockfiles contain two YAML documents (lockfile + settings).
        args: ["--allow-multiple-documents"]
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (secret scan)
        entry: gitleaks git --pre-commit --redact --staged --verbose
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: mypy
        name: mypy (backend, strict)
        entry: uv run --directory backend mypy src
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$
        stages: [pre-commit]

      - id: frontend-prettier
        name: prettier (frontend)
        entry: frontend/node_modules/.bin/prettier --write --config frontend/.prettierrc.json
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx|mjs|cjs|json|css|html|md)$
        stages: [pre-commit]

      - id: frontend-eslint
        name: eslint (frontend)
        entry: frontend/node_modules/.bin/eslint --config frontend/eslint.config.js --fix --max-warnings=0
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        stages: [pre-commit]

      - id: frontend-tsc
        name: tsc (frontend)
        entry: bash -c 'cd frontend && pnpm run typecheck'
        language: system
        pass_filenames: false
        files: ^frontend/.*\.(ts|tsx|json)$
        stages: [pre-commit]

      - id: backend-tests
        name: backend tests (pytest, fast suite)
        entry: bash -c 'cd backend && uv run pytest -x -m "not slow and not postgres"'
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: frontend-tests
        name: frontend tests (vitest)
        entry: bash -c 'cd frontend && pnpm test'
        language: system
        pass_filenames: false
        stages: [pre-push]
