# pnpm settings live here (pnpm 12 no longer reads them from package.json).
# esbuild ships a postinstall build step; allow it so installs are not blocked.
allowBuilds:
  esbuild: true

# Force Tailwind's transitive PostCSS selector parser to a patched release
# (GHSA-rj75-hqrm-r3gf, quadratic parsing below 7.1.6).
overrides:
  postcss-selector-parser: ^7.1.6
