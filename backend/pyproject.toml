[project]
name = "whodat-backend"
version = "0.0.0"
description = "Victory Points fantasy football standings backend"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "espn-api>=0.34.0",  # ESPN fantasy sports API client for M3 provider adapter
    "cryptography>=46",  # AES-256-GCM for league-credential encryption
    "argon2-cffi>=25.1",  # Argon2id password hashing (AC-AU-02)
]

[dependency-groups]
dev = [
    "hypothesis>=6.122,<6.123",
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py315"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.15"
strict = true
files = ["src"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
