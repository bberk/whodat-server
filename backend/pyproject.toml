[project]
name = "whodat-backend"
version = "0.0.0"
description = "Victory Points fantasy football standings backend"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "sqlalchemy>=2.1.6",
    "alembic>=1.20.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "psycopg[binary]>=3.3.6",
    "espn-api>=1.0.1",  # ESPN fantasy sports API client for M3 provider adapter
    "cryptography>=50.0.2",  # AES-256-GCM for league-credential encryption
    "argon2-cffi>=25.1",  # Argon2id password hashing (AC-AU-02)
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.11",
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py315"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.15"
strict = true
files = ["src"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
    "postgres: needs a Postgres database (configured DATABASE_URL); skipped on SQLite",
    "slow: too slow for the pre-push hook; CI runs it",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
